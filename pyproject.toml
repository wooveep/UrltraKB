[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ultrakb"
dynamic = ["version"]
description = "UltraKB: Open LLM Knowledge Base, powered by PageIndex"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kylin", email = "quanqi@pageindex.ai"},
    {name = "Ray", email = "ray@vectify.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "rag", "retrieval", "knowledge-base", "llm", "pageindex", "agents", "document"]
# All dependencies are pinned exactly (supply-chain caution — e.g. the
# litellm package-poisoning incident). Bump deliberately after vetting
# each release.
# litellm 1.87.2 fixes the chatgpt/* (ChatGPT subscription) provider
# returning empty Responses output (BerriAI/litellm#25429) and
# auto-injects GitHub Copilot IDE-auth headers.
dependencies = [
    "pageindex==0.3.0.dev3+urltrakb.17",
    "ictree==0.1.0+urltrakb.3",
    "pageindex-condb==1.0+urltrakb.7",
    "pymupdf==1.27.2.3",
    "regex==2026.5.9",
    "charset-normalizer==3.4.7",
    "defusedxml==0.7.1",
    "beautifulsoup4==4.14.3",
    "markdownify==1.2.2",
    "markitdown[docx,pptx,xlsx,xls]==0.1.5",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "olefile==0.47",
    "trafilatura==2.0.0",
    "click==8.4.0",
    "watchdog==6.0.0",
    "litellm==1.87.2+urltrakb.3",
    "tiktoken==0.13.0",
    "tokenizers==0.23.1",
    "markdown-it-py==4.2.0",
    "openai-agents==0.17.3",
    # openai 2.45.0 added a required `cache_write_tokens` field to
    # InputTokensDetails that openai-agents 0.17.3 does not set, crashing
    # usage parsing on every response (issue #187). Pin below 2.45 until
    # openai-agents catches up.
    "openai==2.44.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "json-repair==0.59.10",
    "prompt_toolkit==3.0.52",
    "rich==15.0.0",
    "portalocker==3.2.0",
]

[project.urls]
Repository = "https://github.com/wooveep/UrltraKB"
Homepage = "https://github.com/wooveep/UrltraKB"
Issues = "https://github.com/wooveep/UrltraKB/issues"

[project.scripts]
ultrakb = "ultrakb.cli:cli"
ultrakb-desktop = "ultrakb.desktop.bootstrap:main"
ultrakb-api = "ultrakb.api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: pure rules and request/response contracts; no external model traffic",
    "integration: local filesystem, HTTP, persistence or process integration",
    "live: real DeepSeek Flash responses through the accounted gateway",
    "native: native desktop/document/process facilities (orthogonal tag)",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.11.2", "shiboken6==6.11.2", "markdown-it-py==4.2.0", "pygments==2.20.0"]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx",
    "ruff==0.9.7",
    "mypy==1.15.0",
    "types-PyYAML==6.0.12.20260518",
]
# Independent REST dependencies, pinned to the versions already in uv.lock.
api = ["fastapi==0.139.0", "uvicorn==0.47.0", "python-multipart==0.0.29"]

[tool.hatch.version]
source = "vcs"

[tool.uv.sources]
pageindex = { path = "vendor/PageIndex", editable = true }
ictree = { path = "vendor/ChatIndex", editable = true }
pageindex-condb = { path = "vendor/ConDB", editable = true }
litellm = { path = "vendor/LiteLLM", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["ultrakb"]
exclude = ["/ultrakb/web"]

# Ship reproducible application/build sources, not maintainer-local workspace
# state or retired bundles that may remain in an upgraded source checkout.
[tool.hatch.build.targets.sdist]
# Ignored scratch symlinks must not claim vendor directory identities during traversal.
skip-excluded-dirs = true
include = [
    "/ultrakb", "/skills", "/tests", "/scripts", "/packaging", "/examples", "/assets/fonts",
    "/vendor/PageIndex", "/vendor/ChatIndex", "/vendor/ConDB", "/vendor/LiteLLM",
    "/docs/vendor-sdk.md",
    "/docs/office-ingest.md",
    "/docs/desktop.md", "/docs/dev-1.2.0.md", "/docs/golden-principles.md",
    "/docs/desktop-evidence/dev-1.2.0",
    "/docs/desktop-workbench.md", "/docs/desktop-evidence/workbench",
    "/docs/*.md", "/AGENTS.md", "/CONTEXT.md",
    "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/source-export.json", "/.gitignore",
    "/Makefile", "/.github/workflows/desktop-build.yml",
]
exclude = ["/ultrakb/web", "/frontend"]

# Preserve this already-vendored upstream file despite the workspace .claude ignore.
[tool.hatch.build.targets.sdist.force-include]
"vendor/PageIndex/.claude/commands/dedupe.md" = "vendor/PageIndex/.claude/commands/dedupe.md"

# Bundle the built-in deck themes + html critic into the wheel so
# `ultrakb deck new` / `--critique` / chat `/deck` work right after
# `pip install` (scan_local_skills also looks under ultrakb/_skills/).
[tool.hatch.build.targets.wheel.force-include]
"assets/fonts/README.md" = "ultrakb/desktop/assets/fonts/README.md"
"assets/fonts/SourceCodePro-Bold.ttf" = "ultrakb/desktop/assets/fonts/SourceCodePro-Bold.ttf"
"assets/fonts/SourceCodePro-BoldIt.ttf" = "ultrakb/desktop/assets/fonts/SourceCodePro-BoldIt.ttf"
"assets/fonts/SourceCodePro-It-OFL.txt" = "ultrakb/desktop/assets/fonts/SourceCodePro-It-OFL.txt"
"assets/fonts/SourceCodePro-It.ttf" = "ultrakb/desktop/assets/fonts/SourceCodePro-It.ttf"
"assets/fonts/SourceCodePro-Medium.ttf" = "ultrakb/desktop/assets/fonts/SourceCodePro-Medium.ttf"
"assets/fonts/SourceCodePro-Regular-OFL.txt" = "ultrakb/desktop/assets/fonts/SourceCodePro-Regular-OFL.txt"
"assets/fonts/SourceCodePro-Regular.ttf" = "ultrakb/desktop/assets/fonts/SourceCodePro-Regular.ttf"
"assets/fonts/SourceHanSansCN-Bold.otf" = "ultrakb/desktop/assets/fonts/SourceHanSansCN-Bold.otf"
"assets/fonts/SourceHanSansCN-Medium.otf" = "ultrakb/desktop/assets/fonts/SourceHanSansCN-Medium.otf"
"assets/fonts/SourceHanSansCN-OFL.txt" = "ultrakb/desktop/assets/fonts/SourceHanSansCN-OFL.txt"
"assets/fonts/SourceHanSansCN-Regular.otf" = "ultrakb/desktop/assets/fonts/SourceHanSansCN-Regular.otf"
"assets/fonts/FrankRuhlHofshi-Bold.otf" = "ultrakb/desktop/assets/fonts/FrankRuhlHofshi-Bold.otf"
"assets/fonts/OfficeSymbol-OFL.txt" = "ultrakb/desktop/assets/fonts/OfficeSymbol-OFL.txt"
"assets/fonts/manifest.json" = "ultrakb/desktop/assets/fonts/manifest.json"
"skills/ultrakb-deck-neon" = "ultrakb/_skills/ultrakb-deck-neon"
"skills/ultrakb-deck-editorial" = "ultrakb/_skills/ultrakb-deck-editorial"
"skills/ultrakb-html-critic" = "ultrakb/_skills/ultrakb-html-critic"

[tool.ruff]
target-version = "py310"
line-length = 100
# Audited upstream snapshots keep their original style; UltraKB additions stay checked.
extend-exclude = ["vendor/PageIndex", "vendor/ChatIndex", "vendor/ConDB", "vendor/LiteLLM", "ultrakb/office/assets/runtime"]

[tool.ruff.lint]
# Start conservative (pyflakes + pycodestyle errors + isort); ratchet up later.
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# cli.py deliberately interleaves imports with side-effecting setup code
# (warning filters that must apply before `markitdown`/`litellm` import,
# `set_tracing_disabled()` before other agents-SDK usage, an
# `os.environ.setdefault(...)` that must run before `import litellm`).
# Reordering to satisfy E402/I001 would risk changing import-time behavior,
# so both are ignored here rather than fixed.
#
# E501 (line-too-long) is scoped to the files whose remaining violations are
# long string literals (docstrings, CLI help text, prompt templates) that
# reflowing would either fail to shorten or would alter user-facing text.
# Everywhere else the 100-column limit is enforced. Shrink this list by
# rewrapping the literals (or adding targeted `# noqa: E501`) over time.
"ultrakb/cli.py" = ["E402", "I001", "E501"]
"ultrakb/agent/chat.py" = ["E501"]
"ultrakb/agent/compiler.py" = ["E501"]
"ultrakb/lint.py" = ["E501"]
"ultrakb/schema.py" = ["E501"]
# Test fixtures asserting exact file contents (frontmatter/index literals);
# rewrapping the strings would change the data under test.
"tests/test_cli.py" = ["E501"]
"tests/test_compiler.py" = ["E501"]
"tests/test_remove.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["ultrakb"]
# Private pinned Office distributions contain their own Python standard library.
exclude = ["ultrakb/office/assets/runtime"]
# Lenient to start (codebase not previously type-checked); ratchet up over time.
ignore_missing_imports = true
# numpy's bundled stubs (reached transitively via litellm/openai-agents ->
# pydantic, not imported by ultrakb directly) use `type X = ...` alias
# statements requiring Python 3.12+ parser support — fatal to the whole run
# (a [syntax] error, not a suppressible diagnostic) when they get parsed. A
# per-module `follow_imports = "skip"` override was experimentally confirmed
# NOT to prevent the parse; only the global default reliably avoids reaching
# that stub, so it stays global rather than scoped narrower.
follow_imports = "skip"

# Pre-existing untyped-data debt is suppressed PER MODULE below (not
# globally), so every other module gets full checking for these error codes.
# Ratchet: fix a module's errors (mostly by giving LLM-JSON payloads proper
# TypedDict/dataclass shapes), then delete its override block.

[[tool.mypy.overrides]]
# Loosely-shaped dict/list data parsed from LLM JSON output flows through
# `Any`-typed helpers: union-attr on Any|None, unannotated accumulator lists,
# argument/return mismatches against str-typed signatures.
module = "ultrakb.agent.compiler"
disable_error_code = [
    "arg-type",
    "dict-item",
    "operator",
    "return-value",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = "ultrakb.cli"
disable_error_code = ["return-value"]

[[tool.mypy.overrides]]
module = ["ultrakb.lint", "ultrakb.indexer"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "ultrakb.skill.workspace"
disable_error_code = ["type-var"]
