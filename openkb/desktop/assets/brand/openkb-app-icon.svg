<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>OpenKB application icon</title>
  <defs>
    <linearGradient id="frost" x1="154" y1="88" x2="844" y2="956" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFCFE"/>
      <stop offset="0.5" stop-color="#F2F6FA"/>
      <stop offset="1" stop-color="#E7EEF5"/>
    </linearGradient>
    <radialGradient id="frost-light" cx="0" cy="0" r="1" gradientTransform="translate(256 188) rotate(50) scale(690)" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.88"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left-page" x1="246" y1="274" x2="444" y2="756" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83D8D4"/>
      <stop offset="1" stop-color="#5FC4CA"/>
    </linearGradient>
    <linearGradient id="right-page" x1="778" y1="274" x2="580" y2="756" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91ACE8"/>
      <stop offset="1" stop-color="#6E8CDA"/>
    </linearGradient>
    <linearGradient id="connector" x1="390" y1="512" x2="634" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9EC7D4" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#A9B9CE" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#9BA9D5" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="tile-shadow" x="0" y="0" width="1024" height="1048" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#71869B" flood-opacity="0.16"/>
    </filter>
    <filter id="mark-shadow" x="140" y="176" width="744" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#6E8298" flood-opacity="0.11"/>
    </filter>
    <clipPath id="tile-clip">
      <rect x="40" y="40" width="944" height="944" rx="224"/>
    </clipPath>
  </defs>

  <g filter="url(#tile-shadow)">
    <rect x="40" y="40" width="944" height="944" rx="224" fill="url(#frost)"/>
  </g>
  <g clip-path="url(#tile-clip)">
    <rect x="40" y="40" width="944" height="944" rx="224" fill="url(#frost-light)"/>
    <circle cx="890" cy="872" r="350" fill="#D9E7F1" fill-opacity="0.22"/>
    <circle cx="126" cy="940" r="280" fill="#FFFFFF" fill-opacity="0.34"/>

    <g filter="url(#mark-shadow)">
      <path d="M405 266C302 291 236 385 236 502C236 631 321 728 444 756" stroke="url(#left-page)" stroke-width="144" stroke-linecap="round"/>
      <path d="M619 266C722 291 788 385 788 502C788 631 703 728 580 756" stroke="url(#right-page)" stroke-width="144" stroke-linecap="round"/>
      <path d="M390 512H634" stroke="url(#connector)" stroke-width="16" stroke-linecap="round"/>
      <circle cx="512" cy="512" r="46" fill="#F0B654"/>
    </g>

    <rect x="56" y="56" width="912" height="912" rx="208" stroke="white" stroke-opacity="0.82" stroke-width="6"/>
    <rect x="41" y="41" width="942" height="942" rx="223" stroke="#D4E0E9" stroke-opacity="0.82" stroke-width="2"/>
  </g>
</svg>
