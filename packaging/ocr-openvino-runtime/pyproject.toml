[project]
name = "openkb-openvino-ocr-runtime"
version = "0.1.0"
requires-python = "==3.12.13"
dependencies = [
  "openvino==2025.4.1", "numpy==2.2.6", "Pillow==11.3.0",
  "opencv-python-headless==4.11.0.86", "torch==2.8.0+cpu", "torchvision==0.23.0+cpu",
  "transformers==4.54.0", "sentencepiece==0.2.1", "protobuf==6.31.1", "shapely==2.1.1",
  "psutil==7.2.2",
]
[tool.uv]
package = false
environments = ["sys_platform == 'linux' or sys_platform == 'win32'"]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
