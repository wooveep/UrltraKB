name: Windows dialog timing diagnosis
on:
  push:
    branches: [codex/office-shutdown-release]
permissions:
  contents: read
jobs:
  windows-dialog:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      SETUPTOOLS_SCM_PRETEND_VERSION: '1.2.2'
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.11.13'
          enable-cache: false
      - name: Export the unchanged release and install its locked environment
        run: |
          uv python install 3.12.13
          python scripts/export_desktop_source.py --commit v1.2.2 --output C:/dialog-check
          cd C:/dialog-check
          uv sync --frozen --python 3.12.13 --extra dev --extra desktop --extra api
      - name: Measure cold startup and repeat the original dialog test
        run: C:/dialog-check/.venv/Scripts/python.exe scripts/diagnose_dialog_timing.py C:/dialog-check
