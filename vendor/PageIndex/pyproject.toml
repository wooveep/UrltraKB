[tool.poetry]
name = "pageindex"
version = "0.3.0.dev3+urltrakb.8"
description = "Python SDK for PageIndex"
readme = "README.md"
license = "MIT"
authors = ["Ray <ray@vectify.ai>"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["rag", "document", "retrieval", "llm", "pageindex", "agents", "vector-database"]
packages = [{include = "pageindex"}]
include = [
    {path = "UPSTREAM.json", format = ["sdist"]},
    {path = "README.urltrakb.md", format = ["sdist"]},
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
litellm = "==1.87.2+urltrakb.3"
pymupdf = "==1.27.2.3"
PyPDF2 = "==3.0.1"
python-dotenv = "==1.2.2"
pyyaml = "==6.0.3"
openai = "==2.44.0"
openai-agents = "==0.17.3"
httpx = {extras = ["socks"], version = "==0.28.1"}
typing-extensions = "==4.15.0"
pydantic = "==2.13.4"

[tool.poetry.group.dev.dependencies]
pytest = "==9.0.3"

[tool.poetry.urls]
Repository = "https://github.com/VectifyAI/PageIndex"
Homepage = "https://pageindex.ai"
Issues = "https://github.com/VectifyAI/PageIndex/issues"

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"
